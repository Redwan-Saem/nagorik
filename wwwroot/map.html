<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>#map { height: 500px; width: 100%; }</style>
</head>
<body>
  <h2>City Corporation — Live Flood Map</h2>
  <div id="map"></div>
  <div id="detail"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([23.78, 90.39], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const colors = { Low: "green", Medium: "orange", High: "red" };
const token = localStorage.getItem("token");
async function loadZones() {
  const res = await fetch("/api/zones/map", { headers: { "Authorization": "Bearer " + token } });
  const zones = await res.json();
  zones.forEach(z => {
    const coords = JSON.parse(z.boundaryGeoJson);
    const polygon = L.polygon(coords, { color: colors[z.riskLevel] }).addTo(map);
    polygon.on('click', () => {
      document.getElementById("detail").innerHTML =
        `<b>${z.zoneId}</b> — Risk: ${z.riskLevel} — Pump: ${z.drainagePumpStatus}`;
    });
  });
}
loadZones();
  </script>
</body>
</html>

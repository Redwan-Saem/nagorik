<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>#map { height: 500px; width: 100%; }</style>
</head>
<body>
  <h2>City Corporation — Live Flood Map</h2>
  <div id="map"></div>
  <select id="filter">
    <option value="All">Show: All</option>
    <option value="Medium">Medium+</option>
    <option value="High">High only</option>
  </select>
  <div id="detail"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([23.78, 90.39], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const colors = { Low: "green", Medium: "orange", High: "red" };
    const token = localStorage.getItem("token");
    let currentFilter = "All";
    let polygons = [];

    async function loadZones() {
      polygons.forEach(p => map.removeLayer(p));
      polygons = [];
      const res = await fetch("/api/zones/map", { headers: { "Authorization": "Bearer " + token } });
      if (!res.ok) {
        document.getElementById("detail").innerText = "Access denied. Log in as an Official.";
        return;
      }
      const zones = await res.json();
      const order = { Low: 1, Medium: 2, High: 3 };
      const minLevel = currentFilter === "All" ? 0 : order[currentFilter];
      zones.forEach(z => {
        if (order[z.riskLevel] < minLevel) return;
        const coords = JSON.parse(z.boundaryGeoJson);
        const polygon = L.polygon(coords, { color: colors[z.riskLevel] }).addTo(map);
        polygon.on('click', () => {
          document.getElementById("detail").innerHTML =
            `<b>${z.zoneId}</b> — Risk: ${z.riskLevel} — Pump: ${z.drainagePumpStatus}`;
        });
        polygons.push(polygon);
      });
    }

    document.getElementById("filter").addEventListener("change", e => {
      currentFilter = e.target.value;
      loadZones();
    });

    loadZones();
    setInterval(loadZones, 60000);
  </script>
</body>
</html>
